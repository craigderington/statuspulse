production:
  service_health_checks:
    class: ServiceCheckJob
    schedule: "* * * * *"
  purge_check_logs:
    class: PurgeCheckLogsJob
    # 03:40 UTC — after the 03:17 backup, so a purge is never the last thing to
    # touch the data before it is captured.
    schedule: "40 3 * * *"
  weekly_digest_emails:
    class: WeeklyDigestJob
    # Trailing timezone is parsed by Fugit and tracks DST on its own: 08:00
    # Eastern is 12:00 UTC in summer and 13:00 UTC in winter. A bare "0 8 * * 1"
    # would fire at 08:00 UTC, which is the middle of the night Eastern.
    schedule: "0 8 * * 1 America/New_York"

development:
  service_health_checks:
    class: ServiceCheckJob
    schedule: "* * * * *"
  purge_check_logs:
    class: PurgeCheckLogsJob
    # 03:40 UTC — after the 03:17 backup, so a purge is never the last thing to
    # touch the data before it is captured.
    schedule: "40 3 * * *"
  weekly_digest_emails:
    class: WeeklyDigestJob
    # Trailing timezone is parsed by Fugit and tracks DST on its own: 08:00
    # Eastern is 12:00 UTC in summer and 13:00 UTC in winter. A bare "0 8 * * 1"
    # would fire at 08:00 UTC, which is the middle of the night Eastern.
    schedule: "0 8 * * 1 America/New_York"
