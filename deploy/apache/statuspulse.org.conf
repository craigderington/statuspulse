# StatusPulse Apache virtual host
#
# Required modules:
#   proxy proxy_http proxy_wstunnel ssl headers rewrite remoteip deflate http2
#
# Before enabling this site, create /var/log/apache2/statuspulse and ensure the
# Ubuntu Apache user can traverse it. The temporary Ubuntu snake-oil certificate
# lets the vhost pass configtest on first install; certbot --apache replaces the
# two certificate directives with the managed Let's Encrypt paths.

# Minimize version information exposed in generated error pages and headers.
ServerTokens Prod
ServerSignature Off

# TRACE is unnecessary for this application and can enable cross-site tracing.
TraceEnable Off

# Keep OCSP responses in shared memory so workers do not fetch them repeatedly.
SSLStaplingCache shmcb:/var/run/apache2/statuspulse-stapling(128000)

# Keep mod_remoteip explicitly constrained to loopback intermediaries. In the
# current direct-to-Apache topology the vhost forwards the immutable connection
# peer address instead of trusting a client-supplied X-Forwarded-For value.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1
RemoteIPInternalProxy ::1

# Include the effective client, forwarded protocol, and Upgrade header to make
# reverse-proxy and Action Cable failures diagnosable without debug logging.
LogFormat "%{c}a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" xfp=\"%{X-Forwarded-Proto}i\" upgrade=\"%{Upgrade}i\"" statuspulse

<VirtualHost *:80>
    ServerName statuspulse.org
    ServerAlias www.statuspulse.org

    # Certbot's HTTP-01 token must remain directly reachable before TLS exists;
    # every other HTTP request is permanently canonicalized to the HTTPS apex.
    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/ [NC]
    RewriteRule ^ https://statuspulse.org%{REQUEST_URI} [R=301,L,NE]

    ErrorLog /var/log/apache2/statuspulse/error.log
    CustomLog /var/log/apache2/statuspulse/access.log statuspulse
</VirtualHost>

<VirtualHost *:443>
    ServerName statuspulse.org
    ServerAlias www.statuspulse.org

    SSLEngine On

    # Bootstrap paths supplied by Ubuntu's ssl-cert package. Running
    # "certbot --apache -d statuspulse.org -d www.statuspulse.org" replaces
    # these with /etc/letsencrypt/live/statuspulse.org/{fullchain,privkey}.pem.
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    # Reject obsolete protocol versions. TLS 1.2 uses a compact AEAD-only
    # cipher list; TLS 1.3 uses OpenSSL's modern AES-GCM and ChaCha suites.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLOpenSSLConfCmd Ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384
    SSLHonorCipherOrder Off

    # Stapling avoids an extra client-side CA lookup while preserving revocation
    # checking. It becomes active once certbot installs the public certificate.
    SSLUseStapling On
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors Off

    # Advertise HTTP/2 while retaining HTTP/1.1, which is required for classic
    # WebSocket Upgrade handshakes handled by mod_proxy_wstunnel.
    Protocols h2 http/1.1

    # The www name is certificate-covered but never serves application content;
    # consolidate cookies, links, and search indexing on the apex hostname.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.statuspulse\.org$ [NC]
    RewriteRule ^ https://statuspulse.org%{REQUEST_URI} [R=301,L,NE]

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off

    # Rails terminates no TLS inside Docker. This explicit header is required by
    # assume_ssl/force_ssl to prevent an HTTPS redirect loop at the proxy edge.
    # Use Apache's underlying connection peer for the client chain so an Internet
    # client cannot spoof Rails' remote IP with its own forwarding header.
    RequestHeader set X-Forwarded-For "expr=%{CONN_REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Action Cable MUST precede the catch-all proxy.
    #
    # An explicit ProxyPass is required here, not just the conditional
    # RewriteRule below: Apache evaluates ProxyPass during translate_name BEFORE
    # RewriteRule [P], so the catch-all would win and forward /cable as ordinary
    # HTTP. Action Cable answers 404 to non-upgrade requests, so the symptom is a
    # site that loads perfectly while live status cards silently never update.
    #
    # /cable serves WebSockets exclusively, so tunneling it unconditionally is
    # safe. The RewriteRule is kept as a belt-and-braces fallback.
    ProxyPass        /cable ws://127.0.0.1:3000/cable
    ProxyPassReverse /cable ws://127.0.0.1:3000/cable

    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/cable(.*)$ ws://127.0.0.1:3000/cable$1 [P,L]

    # Proxy every HTTP path, including /up and /assets, into the image. Assets
    # do not exist on the host, so deliberately do not add DocumentRoot/Alias.
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=60 retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    # HSTS pins HTTPS for the apex and subdomains. "preload" is intentionally
    # included; submit only after confirming every subdomain supports HTTPS.
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # Browser hardening: block MIME sniffing, minimize referrer leakage, deny
    # framing, and disable powerful APIs that this status dashboard does not use.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Content-Security-Policy "frame-ancestors 'none'"
    Header always set X-Frame-Options "DENY"
    Header always unset X-Powered-By

    # Compress text formats to reduce transfer size; images and other already
    # compressed binary formats are intentionally excluded.
    AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css
    AddOutputFilterByType DEFLATE application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml

    ErrorLog /var/log/apache2/statuspulse/error.log
    CustomLog /var/log/apache2/statuspulse/access.log statuspulse
</VirtualHost>
